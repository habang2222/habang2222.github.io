syntax = "proto3";
option csharp_namespace = "EveRemote.Protocol.V1";
package everemote.v1;
import "google/protobuf/timestamp.proto";

service AgentStatus {
  rpc GetSnapshot (AgentStatusRequest) returns (AgentStatusReply);
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatReply);
}
message AgentStatusRequest { string controller_id = 1; }
message AgentStatusReply {
  string agent_id = 1;
  string machine_name = 2;
  google.protobuf.Timestamp observed_at_utc = 3;
  repeated EveClientStatus clients = 4;
}
message EveClientStatus {
  string client_id = 1;
  int32 process_id = 2;
  int64 window_handle = 3;
  string window_title = 4;
  int32 client_width = 5;
  int32 client_height = 6;
  bool is_minimized = 7;
}
message ScreenFrame {
  string client_id = 1;
  int32 width = 2;
  int32 height = 3;
  google.protobuf.Timestamp captured_at_utc = 4;
  bytes payload = 5;
  string encoding = 6;
  int64 sequence_number = 7;
}
enum RemoteInputTypeMessage {
  REMOTE_INPUT_TYPE_UNSPECIFIED = 0;
  MOUSE_MOVE = 1;
  MOUSE_DOWN = 2;
  MOUSE_UP = 3;
  MOUSE_WHEEL = 4;
  KEY_DOWN = 5;
  KEY_UP = 6;
}
message RemoteInputEventMessage {
  string session_id = 1;
  string agent_id = 2;
  string client_id = 3;
  RemoteInputTypeMessage type = 4;
  double normalized_x = 5;
  double normalized_y = 6;
  int32 mouse_button = 7;
  int32 virtual_key_code = 8;
  int32 wheel_delta = 9;
  int64 sequence_number = 10;
  google.protobuf.Timestamp created_at_utc = 11;
}
message StartSessionRequest { string controller_id = 1; string agent_id = 2; string client_id = 3; }
message SessionReply { string session_id = 1; bool accepted = 2; string error_code = 3; }
message EndSessionRequest { string session_id = 1; }
message HeartbeatRequest { string controller_id = 1; google.protobuf.Timestamp sent_at_utc = 2; }
message HeartbeatReply { google.protobuf.Timestamp received_at_utc = 1; }
message ErrorMessage { string code = 1; string message = 2; }
